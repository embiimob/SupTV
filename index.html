<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SupTV - fullscreen-first infinite p2fk.io video stream with live social overlays." />
  <meta name="theme-color" content="#02020a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SupTV" />
  <meta property="og:title" content="SupTV ✦ Infinite Video Stream" />
  <meta property="og:description" content="Search p2fk.io videos, go fullscreen, and ride a nonstop SupTV stream." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="SupTV ✦ Infinite Video Stream" />
  <meta name="twitter:description" content="Fullscreen-first p2fk.io stream with a retro-cool SupTV vibe." />
  <title>SupTV</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #02020a;
      --panel: rgba(5, 8, 18, 0.62);
      --accent: #41d1ff;
      --accent-2: #b18fff;
      --text: #f4f7ff;
      --muted: #a4b1d8;
      --swipe-tug-transition-ms: 180ms;
    }

    * { box-sizing: border-box; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top right, #16233d, #050811 40%, #02020a 80%);
      border: 1px solid rgba(137, 166, 232, .16);
      box-shadow: inset 0 0 0 2px rgba(130, 167, 255, .06), inset 0 0 120px rgba(41, 95, 205, .15);
      --swipe-tug-x: 0px;
      transform: translate3d(var(--swipe-tug-x), 0, 0);
      transition: transform var(--swipe-tug-transition-ms) ease;
    }

    #app.swipe-tugging { transition: none; }
    #app.swipe-tug-release { transition: transform var(--swipe-tug-transition-ms) ease-out; }

    #player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent 20%, transparent 70%, rgba(0,0,0,.65));
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.1rem;
      background: linear-gradient(to bottom, rgba(1,3,8,.8), rgba(1,3,8,.08));
      pointer-events: auto;
      z-index: 8;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
      background: none;
      border: none;
      color: inherit;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .brand b { font-size: 1.15rem; }
    .brand span { color: var(--muted); font-size: .85rem; }

    .controls {
      display: flex;
      align-items: center;
      gap: .5rem;
      width: min(58vw, 680px);
      pointer-events: auto;
    }

    .controls input {
      flex: 1;
      background: rgba(12, 18, 34, 0.86);
      border: 1px solid rgba(120, 143, 198, .4);
      color: var(--text);
      border-radius: .7rem;
      padding: .65rem .8rem;
      font-size: .96rem;
      outline: none;
    }

    .controls button {
      border: none;
      border-radius: .7rem;
      padding: .65rem .9rem;
      color: #00131f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      min-width: 2.6rem;
    }

    .controls .skip-inline {
      background: rgba(13, 21, 41, .78);
      color: #dbe7ff;
      border: 1px solid rgba(132, 157, 217, .36);
      font-weight: 700;
    }

    .controls .audio-toggle {
      background: rgba(13, 21, 41, .78);
      color: #dbe7ff;
      border: 1px solid rgba(132, 157, 217, .36);
      font-weight: 700;
      min-width: 3rem;
    }

    .side-feed {
      position: absolute;
      right: 1rem;
      top: 6rem;
      width: min(30vw, 360px);
      min-height: 6rem;
      max-height: calc(100vh - 10.4rem);
      overflow: hidden;
      pointer-events: auto;
      z-index: 7;
    }

    #messages {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #messages li {
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      border-radius: .85rem;
      border: 1px solid rgba(122, 149, 216, .2);
      background: rgba(12, 18, 32, .34);
      backdrop-filter: blur(7px);
      padding: .7rem .75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .26);
      animation: cardInOut 13.5s ease forwards;
      pointer-events: auto;
      max-height: min(56vh, 560px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    @keyframes cardInOut {
      0% { opacity: 0; transform: translate3d(0, 10px, 0); }
      10% { opacity: .92; transform: translate3d(0, 0, 0); }
      78% { opacity: .92; transform: translate3d(0, 0, 0); }
      100% { opacity: 0; transform: translate3d(0, -8px, 0); }
    }

    .message-card-title {
      font-size: .84rem;
      font-weight: 700;
      margin-bottom: .2rem;
      line-height: 1.2;
      color: #f0f6ff;
      overflow-wrap: anywhere;
    }

    .message-card-meta {
      font-size: .69rem;
      letter-spacing: .02em;
      color: #b9cbf8;
      margin-bottom: .25rem;
      opacity: .85;
      overflow-wrap: anywhere;
    }

    .message-card-body {
      font-size: .78rem;
      color: #dbe8ff;
      line-height: 1.27;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-card-body a {
      color: #97ccff;
      text-decoration: underline;
      word-break: break-word;
    }

    .message-card-body button {
      border: 1px solid rgba(128, 163, 234, .35);
      background: rgba(10, 18, 36, .82);
      color: #cfe6ff;
      border-radius: 999px;
      padding: .08rem .45rem;
      font-size: .72rem;
      cursor: pointer;
      margin: 0 .12rem;
    }

    .message-card-image {
      display: block;
      width: 100%;
      max-height: min(34vh, 260px);
      margin-top: .45rem;
      object-fit: contain;
      border-radius: .6rem;
      border: 1px solid rgba(135, 160, 214, .25);
      opacity: .95;
      background: rgba(7, 14, 28, .7);
    }

    .message-card-links {
      display: grid;
      gap: .2rem;
      margin-top: .35rem;
    }

    .message-card-links a {
      color: #97ccff;
      font-size: .72rem;
      text-decoration: underline;
      word-break: break-all;
    }

    .message-card-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: .25rem;
      margin-top: .35rem;
    }

    .message-card-keywords button {
      border: 1px solid rgba(128, 163, 234, .35);
      background: rgba(10, 18, 36, .82);
      color: #cfe6ff;
      border-radius: 999px;
      padding: .12rem .5rem;
      font-size: .68rem;
      cursor: pointer;
    }


    .waiting-overlay {
      position: absolute;
      right: 1rem;
      bottom: 3.4rem;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      color: #deebff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 8;
    }

    .waiting-overlay.visible {
      opacity: 1;
    }

    .waiting-box {
      display: flex;
      align-items: center;
      gap: .3rem;
      text-align: left;
      background: rgba(8, 14, 28, .38);
      border: 1px solid rgba(142, 167, 228, .24);
      border-radius: 999px;
      padding: .2rem .55rem;
      min-width: 0;
      font-size: .72rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .24);
      backdrop-filter: blur(4px);
    }

    .off-air-screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #2f2f33, #15161b 58%, #09090b 100%);
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .off-air-screen.visible {
      display: flex;
    }

    .off-air-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,.04), rgba(255,255,255,.04) 2px, rgba(0,0,0,0) 3px, rgba(0,0,0,0) 6px);
      mix-blend-mode: soft-light;
      opacity: .5;
      pointer-events: none;
    }

    .off-air-card {
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
      background: linear-gradient(180deg, #f0f0f0 0%, #dedede 38%, #999 60%, #272727 100%);
      position: relative;
      overflow: hidden;
      box-shadow: none;
    }

    .off-air-bars {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,
          #f7f7f7 0 15%,
          #f8da3d 15% 30%,
          #38d9e8 30% 45%,
          #65e264 45% 60%,
          #e45757 60% 75%,
          #6c69e8 75% 100%);
      opacity: .68;
    }

    .off-air-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f7fbff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .58);
      font-weight: 800;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      letter-spacing: .18em;
      text-transform: uppercase;
      background: radial-gradient(circle at center, rgba(0,0,0,.15), rgba(0,0,0,.6));
    }

    .hidden-ui .topbar,
    .hidden-ui .ticker-wrap,
    .hidden-ui .banner-menu,
    .hidden-ui .status,
    .hidden-ui .side-feed,
    .hidden-ui .waiting-overlay {
      opacity: 0;
      pointer-events: none;
    }

    .fullscreen-mode #player {
      object-fit: contain;
    }

    .fullscreen-mode .status {
      bottom: 1rem;
    }

    #messages {
      margin: 0;
    }

    .status {
      position: absolute;
      left: 1rem;
      bottom: 3.6rem;
      pointer-events: auto;
      font-size: .95rem;
      color: #e9f1ff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, .7);
      max-width: min(70vw, 900px);
      z-index: 7;
    }

    .status a {
      color: #97ccff;
      text-decoration: underline;
      pointer-events: auto;
      word-break: break-word;
    }

    .status button {
      border: 1px solid rgba(128, 163, 234, .35);
      background: rgba(10, 18, 36, .82);
      color: #cfe6ff;
      border-radius: 999px;
      padding: .08rem .48rem;
      font-size: .74rem;
      cursor: pointer;
      pointer-events: auto;
      margin: 0 .15rem;
    }

    .ticker-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3rem;
      border-top: 1px solid rgba(131, 152, 206, .3);
      background: rgba(4, 8, 20, .85);
      overflow: hidden;
      pointer-events: auto;
      transition: opacity .25s ease;
      z-index: 7;
      cursor: pointer;
      border: none;
      width: 100%;
      text-align: left;
      padding: 0;
    }

    #ticker {
      position: absolute;
      left: 0;
      white-space: nowrap;
      padding-left: 1.5rem;
      padding-right: 5rem;
      line-height: 3rem;
      color: #dbebff;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: .02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .7);
      transform: translate3d(100%, 0, 0);
      will-change: transform;
      pointer-events: none;
    }

    .banner-menu {
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 3.4rem;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 14px, 0);
      transition: opacity .22s ease, transform .22s ease;
      z-index: 9;
    }

    .banner-menu.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
    }

    .banner-menu-panel {
      border: 1px solid rgba(122, 149, 216, .35);
      border-radius: .82rem;
      background: rgba(8, 14, 28, .94);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .44);
      overflow: hidden;
      max-height: min(62vh, 560px);
      display: flex;
      flex-direction: column;
    }

    .banner-menu-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: .8rem;
      padding: .8rem;
      min-height: 0;
    }

    .banner-menu-section {
      border: 1px solid rgba(122, 149, 216, .2);
      border-radius: .68rem;
      background: rgba(9, 14, 27, .72);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .banner-menu-section h3 {
      margin: 0;
      padding: .62rem .68rem .55rem;
      font-size: .8rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #c9ddff;
      border-bottom: 1px solid rgba(122, 149, 216, .18);
    }

    .banner-queue-list {
      margin: 0;
      padding: .5rem .9rem .72rem 1.7rem;
      overflow-y: auto;
      list-style: decimal;
      display: grid;
      gap: .34rem;
      min-height: 0;
      scrollbar-width: thin;
    }

    .banner-queue-list li {
      font-size: .78rem;
      color: #dcebff;
      line-height: 1.26;
      overflow-wrap: anywhere;
    }

    .banner-queue-item-meta {
      display: block;
      margin-top: .1rem;
      font-size: .67rem;
      color: #aac5ee;
      opacity: .9;
    }

    .banner-menu-empty {
      margin: 0;
      padding: .72rem .8rem;
      font-size: .75rem;
      color: #b8ccef;
    }

    .banner-menu-footer {
      border-top: 1px solid rgba(122, 149, 216, .18);
      padding: .55rem .65rem .62rem;
      display: flex;
      justify-content: flex-start;
    }

    .banner-more-btn {
      border: 1px solid rgba(128, 163, 234, .35);
      background: rgba(10, 18, 36, .82);
      color: #cfe6ff;
      border-radius: 999px;
      padding: .2rem .66rem;
      font-size: .73rem;
      font-weight: 700;
      cursor: pointer;
    }

    .banner-trending-list {
      padding: .56rem .62rem .66rem;
      overflow-y: auto;
      display: grid;
      gap: .34rem;
      min-height: 0;
      scrollbar-width: thin;
    }

    .banner-trending-btn {
      border: 1px solid rgba(128, 163, 234, .35);
      background: rgba(10, 18, 36, .82);
      color: #d7e9ff;
      border-radius: .62rem;
      padding: .44rem .5rem;
      font-size: .74rem;
      text-align: left;
      cursor: pointer;
      line-height: 1.24;
    }

    .banner-trending-btn strong {
      display: block;
      font-size: .78rem;
      margin-bottom: .08rem;
    }

    @media (max-width: 920px) {
      .side-feed { width: calc(100vw - 2rem); top: auto; bottom: 7.3rem; max-height: min(44vh, 440px); }
      .controls { width: min(72vw, 560px); }
      .brand span { display: none; }
      .waiting-overlay { right: .65rem; bottom: 3.25rem; }
      .banner-menu {
        left: .65rem;
        right: .65rem;
      }
      .banner-menu-grid {
        grid-template-columns: 1fr;
      }
      .banner-menu-panel {
        max-height: min(68vh, 600px);
      }
    }

    @media (max-width: 640px) {
      .topbar {
        flex-wrap: wrap;
        gap: .45rem;
        padding-top: calc(.62rem + env(safe-area-inset-top));
        padding-right: calc(.62rem + env(safe-area-inset-right));
        padding-left: calc(.62rem + env(safe-area-inset-left));
        padding-bottom: .62rem;
      }
      .brand b { font-size: 1.05rem; }
      .controls {
        width: 100%;
        min-width: 0;
        gap: .35rem;
      }
      .controls input {
        min-width: 0;
        padding: .56rem .66rem;
        font-size: .9rem;
      }
      .controls button {
        min-width: 2.25rem;
        padding: .56rem .64rem;
        border-radius: .62rem;
        font-size: .95rem;
      }
      .controls .audio-toggle { min-width: 2.55rem; }
      .side-feed {
        right: .62rem;
        width: calc(100vw - 1.24rem);
      }
      .status {
        left: .62rem;
        max-width: calc(100vw - 1.24rem);
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <video id="player" autoplay muted playsinline aria-label="SupTV video player" tabindex="0"></video>
    <div class="overlay"></div>

    <header class="topbar">
      <button type="button" class="brand" id="brandBtn" title="Back to trending" aria-label="Back to trending"><b>SupTV</b><span>uncensored</span></button>
      <form class="controls" id="searchForm" autocomplete="off">
        <input id="query" type="text" placeholder="Search p2fk.io videos by keyword" />
        <button type="button" class="audio-toggle" id="audioBtn" title="Unmute" aria-label="Unmute">🔇</button>
        <button type="button" class="download-inline" id="downloadBtn" title="Download index.html" aria-label="Download index.html">⬇</button>
        <button type="button" id="fullscreenBtn" aria-keyshortcuts="f" title="Full Screen" aria-label="Full Screen">⛶</button>
        <button type="button" class="skip-inline" id="skipInlineBtn" title="Skip video" aria-label="Skip video">⏭</button>
      </form>
    </header>

    <section class="side-feed" aria-live="polite">
      <ul id="messages"></ul>
    </section>

    <section class="off-air-screen" id="offAirScreen" aria-live="polite">
      <div class="off-air-card" role="img" aria-label="Station off air signal">
        <div class="off-air-bars"></div>
        <div class="off-air-center">SUPTV · OFF AIR</div>
      </div>
    </section>

    <section class="waiting-overlay" id="waitingOverlay" aria-live="polite">
      <div class="waiting-box">
        <div id="waitingText" aria-hidden="true">⏳</div>
        <span class="sr-only" id="waitingA11yText">Buffering stream</span>
      </div>
    </section>

    <section class="banner-menu" id="bannerMenu" aria-hidden="true">
      <div class="banner-menu-panel" role="dialog" aria-label="Queue and trending searches">
        <div class="banner-menu-grid">
          <section class="banner-menu-section">
            <h3>Queue</h3>
            <ol class="banner-queue-list" id="bannerQueueList"></ol>
            <p class="banner-menu-empty" id="bannerQueueEmpty">No queued videos right now.</p>
            <div class="banner-menu-footer">
              <button type="button" class="banner-more-btn" id="bannerQueueMoreBtn">Show 20 more</button>
            </div>
          </section>
          <section class="banner-menu-section">
            <h3>Top Trending Searches</h3>
            <div class="banner-trending-list" id="bannerTrendingList"></div>
            <p class="banner-menu-empty" id="bannerTrendingEmpty">Trending searches are loading…</p>
          </section>
        </div>
      </div>
    </section>

    <div class="status" id="status" role="status" aria-live="polite">Loading…</div>
    <button type="button" class="ticker-wrap" id="tickerWrap" aria-expanded="false" aria-label="Show queued videos and trending searches"><span id="ticker"></span></button>
  </main>

  <script>
    const dom = {
      video: document.getElementById('player'),
      status: document.getElementById('status'),
      ticker: document.getElementById('ticker'),
      messages: document.getElementById('messages'),
      query: document.getElementById('query'),
      searchForm: document.getElementById('searchForm'),
      audioBtn: document.getElementById('audioBtn'),
      downloadBtn: document.getElementById('downloadBtn'),
      fullscreenBtn: document.getElementById('fullscreenBtn'),
      skipInlineBtn: document.getElementById('skipInlineBtn'),
      brandBtn: document.getElementById('brandBtn'),
      app: document.getElementById('app'),
      tickerWrap: document.getElementById('tickerWrap'),
      bannerMenu: document.getElementById('bannerMenu'),
      bannerQueueList: document.getElementById('bannerQueueList'),
      bannerQueueEmpty: document.getElementById('bannerQueueEmpty'),
      bannerQueueMoreBtn: document.getElementById('bannerQueueMoreBtn'),
      bannerTrendingList: document.getElementById('bannerTrendingList'),
      bannerTrendingEmpty: document.getElementById('bannerTrendingEmpty'),
      offAirScreen: document.getElementById('offAirScreen'),
      waitingOverlay: document.getElementById('waitingOverlay'),
      waitingText: document.getElementById('waitingText'),
      waitingA11yText: document.getElementById('waitingA11yText')
    };

    const DEFAULT_KEYWORD = 'mp4';
    const MAX_PLAYLIST_ITEMS = 50;
    const TRENDING_MAX_PLAYLIST_ITEMS = 500;
    const TRENDING_KEYWORD_LIMIT = 20;
    const TRENDING_KEYWORD_BATCH_SIZE = 5;
    const BANNER_QUEUE_PAGE_SIZE = 20;
    const BANNER_TOP_TRENDING_SIZE = 10;
    const TICKER_TRENDING_STATS_SIZE = 5;
    const STANDARD_SEARCH_QTY = 200;
    const TRENDING_SEARCH_QTY = 200;
    const TRENDING_KEYWORD_FETCH_TIMEOUT_MS = 12000;
    const TRENDING_KEYWORD_FETCH_CONCURRENCY = 4;
    const PRELOAD_COUNT = 5;
    const TICKER_SCROLL_SPEED_PX_PER_SECOND = 44;
    const MS_PER_SECOND = 1000;
    const STREAM_RETRY_LIMIT = 1;
    const IPFS_GATEWAY_RETRY_LIMIT = 1;
    const ACTIVE_STREAM_TIMEOUT_MS = 12000;
    const READY_RANGE_START_ALLOWANCE_SECONDS = 0.75;
    const FULLY_BUFFERED_EPSILON_SECONDS = 0.35;
    const MESSAGE_ROTATION_INTERVAL_MS = 13500;
    const HUD_IDLE_HIDE_MS = 2800;
    const FULLSCREEN_ACTIVATION_DELAY_MS = 120;
    const MOUSE_SHOW_DISTANCE_PX = 48;
    const DOWNLOAD_BLOB_URL_REVOKE_DELAY_MS = 5000;

    const normalize = (value) => (typeof value === 'string' ? value.trim() : '');

    const claimStreamRetry = (url) => {

    const extractImageUrl = (messageText) => {

    const toTimestamp = (value) => {

    const unwrapQuotedText = (value) => normalize(value).replace(/^"|"$/g, '');
    const splitInlineIpfsSuffix = (value) => {

    const stripTrailingUrlPunctuation = (value) => {

    const formatLinkLabel = (value, max = 42) => {

    const rootAddressCandidate = (root) => normalize(

    );
    const normalizeAddressForCompare = (value) => cleanDisplayText(value || '').trim();
    const sameAddressValue = (a, b) => {
      const left = normalizeAddressForCompare(a);

      if (!left || !right) return false;
      if (left === right) return true;
      if (left.startsWith('0x') && right.startsWith('0x')) return left.toLowerCase() === right.toLowerCase();

    const extractProfileUrn = (profile) => cleanDisplayText(profile?.urn || profile?.URN || profile?.Urn || profile?.profileURN || profile?.ProfileURN || '');
    const normalizeCreatorValue = (value) => {

    const extractCreatorAddresses = (profile) => {

    const profileHasCreatorMatch = (profile, address) => {

    const profileDisplayName = (profile) => {

    function appendInteractiveTokenText(fragment, text) {
      const source = normalize(text);

      const hashtagRegex = new RegExp(KEYWORD_REGEX.source, 'g');
      let lastIndex = 0;
      let match;
      while ((match = hashtagRegex.exec(source)) !== null) {
        const before = source.slice(lastIndex, match.index);
        if (before) fragment.appendChild(document.createTextNode(before));
        const keyword = normalize(match[1]).toLowerCase();
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `#${keyword}`;
        button.addEventListener('click', () => triggerKeywordSearch(keyword));
        fragment.appendChild(button);
        lastIndex = hashtagRegex.lastIndex;

      const trailing = source.slice(lastIndex);
      if (trailing) fragment.appendChild(document.createTextNode(trailing));

      const content = document.createDocumentFragment();

          seenTx.add(txid);
          return true;

    function parseItems(messages, addressLabels = new Map()) {
      const seen = new Set();
      const isValidIpfsVideoMessage = (messageText) => {

      return messages
        .map((msg) => {
          const root = unwrapRootPayload(msg) || {};
          const messageText = normalizeRootMsg(root);
          if (!messageText) return null;

          const directMatch = messageText.match(DIRECT_VIDEO_REGEX);
          if (directMatch) {
            const directUrl = stripTrailingUrlPunctuation(directMatch[1]);
            if (!directUrl) return null;
            if (seen.has(directUrl)) return null;
            seen.add(directUrl);

            return {
              url: directUrl,
              title,
              description: cleanDisplayText(messageText),
              tags: [],
              links: extractLinks(messageText),
              keywords: extractKeywords(messageText, title),

              createdAt: messageBlockDate(root),
              hash: '',
              subject: cleanDisplayText(normalize(root?.Subject || root?.subject || '')),

              txid: messageTxid(root),

          const { ipfsMatch, fileMatch, valid } = isValidIpfsVideoMessage(messageText);
          if (!valid) return null;
          const hash = ipfsMatch[1];
          const sourcePath = normalize(fileMatch[1] || '');
          const filename = stripPathParts(sourcePath).trim();
          const url = buildIpfsPathUrl(hash, '', 0);
          if (seen.has(url)) return null;
          seen.add(url);

            return {
              url,
              title: cleanDisplayText(filename || `IPFS ${hash.slice(0, 12)}`),
              description: cleanDisplayText(messageText),
              tags: [],
              links: extractLinks(messageText),
              keywords: extractKeywords(messageText, normalize(root?.Subject || root?.subject || filename)),
              from: displayFromAddress(root, addressLabels),
              createdAt: messageBlockDate(root),
              hash,
              path: '',
              gatewayIndex: 0,
              subject: cleanDisplayText(normalize(root?.Subject || root?.subject || '')),
              imageUrl: extractImageUrl(messageText),
              txid: messageTxid(root),
              timestamp: messageTimestamp(root)
            };
        })
        .filter(Boolean)
        .sort((a, b) => sortByNewestTimestamp(a.timestamp, b.timestamp));
    }

    function parseSocialCards(messages, addressLabels = new Map()) {
      return messages
        .map((msg) => {
          const root = unwrapRootPayload(msg) || {};
          const messageText = normalizeRootMsg(root);
          if (!messageText) return null;
          const subject = cleanDisplayText(normalize(root?.Subject || root?.subject || ''));
          const from = displayFromAddress(root, addressLabels);
          const createdAt = messageBlockDate(root);
          const timestamp = messageTimestamp(root);
          const txid = messageTxid(root);
          return createSocialCard({
            title: subject || cleanDisplayText(messageText.slice(0, 58)) || 'Thread update',
            meta: `${from ? shortTitle(from, 18) : 'p2fk'}${createdAt ? ` · ${formatUtcDate(createdAt)}` : ''}${txid ? ` · tx:${txid.slice(0, 10)}…` : ''}`,
            body: cleanDisplayText(messageText),
            imageUrl: extractImageUrl(messageText),
            links: extractLinks(messageText),
            keywords: extractKeywords(messageText, subject),
            createdAt,
            timestamp,
            key: txid || `${timestamp}:${subject || messageText.slice(0, 40)}`
          });
        })
        .filter(Boolean)
        .sort((a, b) => sortByNewestTimestamp(a.timestamp, b.timestamp) * -1);
    }

    function statusForItem(item, index) {
      if (!item) return 'queued';
      if (currentEntry?.url === item.url) return 'playing';
      if (videoStatusByUrl.has(item.url)) return videoStatusByUrl.get(item.url);
      return index > 0 && index <= PRELOAD_COUNT ? 'downloading' : 'queued';
    }

    function tickerViewportWidth() {
      return dom.ticker.parentElement?.clientWidth || window.innerWidth || 0;
    }

    function applyTickerPosition() {
      dom.ticker.style.transform = `translate3d(${Math.round(tickerPositionPx)}px, 0, 0)`;
    }

    function measureTicker({ preservePosition = true } = {}) {
      tickerContentWidthPx = dom.ticker.scrollWidth || 0;
      const viewportWidth = tickerViewportWidth();

      if (!tickerAnimationReady) {
        tickerPositionPx = viewportWidth;
        tickerAnimationReady = true;
        applyTickerPosition();
        return;
      }

      if (!preservePosition) tickerPositionPx = viewportWidth;
      if (tickerPositionPx <= -tickerContentWidthPx) tickerPositionPx = viewportWidth;
      if (tickerPositionPx > viewportWidth) tickerPositionPx = viewportWidth;
      applyTickerPosition();
    }

    function tickTicker(timestamp) {
      if (!tickerAnimationReady) measureTicker({ preservePosition: false });
      if (!tickerLastFrameTs) tickerLastFrameTs = timestamp;
      const elapsedSeconds = Math.max(0, (timestamp - tickerLastFrameTs) / MS_PER_SECOND);
      tickerLastFrameTs = timestamp;

      tickerPositionPx -= TICKER_SCROLL_SPEED_PX_PER_SECOND * elapsedSeconds;
      if (tickerPositionPx <= -tickerContentWidthPx) tickerPositionPx = tickerViewportWidth();
      applyTickerPosition();
      tickerAnimationFrameId = window.requestAnimationFrame(tickTicker);
    }

    function ensureTickerAnimation() {
      if (tickerAnimationFrameId) return;
      tickerLastFrameTs = 0;
      tickerAnimationFrameId = window.requestAnimationFrame(tickTicker);
    }

    function updateTicker(items = playQueue, keyword = currentKeyword) {
      const statusCards = items.slice(0, PRELOAD_COUNT + 1).map((item, idx) => {
        const marker = idx === 0 ? '▶' : `${idx + 1}`;
        return `${marker} ${shortTitle(item.title, 28)} • ${statusForItem(item, idx).toUpperCase()}`;
      });
      const probeWindow = items.slice(0, PRELOAD_COUNT + 1);
      const probingCount = probeWindow.reduce((count, item, idx) => {
        const status = statusForItem(item, idx);
        return status === 'playing' || status === 'downloading' || status === 'ready' ? count + 1 : count;
      }, 0);
      const summary = `FOUND ${searchResultTotal} • QUEUED ${items.length} • PROBING ${probingCount}/${probeWindow.length} • ${keyword.toUpperCase()}`;
      const trendingText = normalize(keyword).toLowerCase() === 'trending' && trendingStatsRows.length
        ? `TOP SEARCHES ${trendingStatsRows.slice(0, TICKER_TRENDING_STATS_SIZE).map((row) => `${cleanDisplayText(row?.term || '') || 'unknown'} (${formatMetricCount(row?.views)} views)`).join(' • ')}`
        : '';
      dom.ticker.textContent = statusCards.length
        ? `${tickerLabel(keyword)}${summary}${trendingText ? `${TICKER_SECTION_SEPARATOR}${trendingText}` : ''}${TICKER_SECTION_SEPARATOR}${statusCards.join(TICKER_ITEM_SEPARATOR)}`
        : `${tickerLabel(keyword)}${summary}${trendingText ? `${TICKER_SECTION_SEPARATOR}${trendingText}` : ''} • No matching videos`;
      measureTicker();
      ensureTickerAnimation();
      renderBannerQueue();
    }

    function flushNextQueuedMessage() {
      if (activeMessageTimeoutId || !queuedMessages.length) return;
      const card = queuedMessages.shift();

      dom.messages.replaceChildren(li);
      activeMessageTimeoutId = window.setTimeout(() => {

        flushNextQueuedMessage();

      for (const timeoutId of scheduledMessageTimeouts) clearTimeout(timeoutId);

    function isBufferedFromStartThroughEnd(videoEl) {
      const duration = Number(videoEl?.duration);
      if (!Number.isFinite(duration) || duration <= 0) return false;
      const ranges = videoEl?.buffered;
      if (!ranges || !ranges.length) return false;
      for (let i = 0; i < ranges.length; i += 1) {
        const start = Number(ranges.start(i));
        const end = Number(ranges.end(i));
        if (!Number.isFinite(start) || !Number.isFinite(end)) continue;
        if (start <= READY_RANGE_START_ALLOWANCE_SECONDS && end >= (duration - FULLY_BUFFERED_EPSILON_SECONDS)) {
          return true;
        }
      }
      return false;
    }

    function isProbeReady(videoEl) {
      const readyState = Number(videoEl?.readyState || 0);
      if (readyState < HTMLMediaElement.HAVE_FUTURE_DATA) return false;
      return isBufferedFromStartThroughEnd(videoEl);
    }

    function clearPreloadProbe(url, media) {
      const probe = media || preloadElements.get(url);
      if (probe) {
        probe.removeAttribute('src');
        probe.load();
      }
      preloadElements.delete(url);
      const poller = preloadStatusPollers.get(url);
      if (poller) {
        clearInterval(poller);
        preloadStatusPollers.delete(url);
      }
    }

    function stopPreloadPoller(url) {
      const poller = preloadStatusPollers.get(url);
      if (!poller) return;
      clearInterval(poller);
      preloadStatusPollers.delete(url);
    }

    function clearAllPreloadProbes() {
      for (const [url, media] of preloadElements.entries()) {
        clearPreloadProbe(url, media);
      }
    }

    function primePreloadCandidates() {
      for (const [url, media] of preloadElements.entries()) {
        if (!playQueue.some((item) => item.url === url)) {
          clearPreloadProbe(url, media);
        }
      }
      for (const candidate of playQueue.slice(1, PRELOAD_COUNT + 1)) {
        if (preloadElements.has(candidate.url)) continue;
        if (videoStatusByUrl.get(candidate.url) === 'error') continue;
        const probe = document.createElement('video');
        probe.preload = 'auto';
        probe.muted = true;
        probe.playsInline = true;
        videoStatusByUrl.set(candidate.url, 'downloading');
        const refreshProbeStatus = () => {
          const nextStatus = isProbeReady(probe) ? 'ready' : 'downloading';
          if (videoStatusByUrl.get(candidate.url) !== nextStatus) {
            videoStatusByUrl.set(candidate.url, nextStatus);
            updateTicker();
          }
        };
        probe.addEventListener('loadedmetadata', refreshProbeStatus);
        probe.addEventListener('loadeddata', refreshProbeStatus);
        probe.addEventListener('progress', refreshProbeStatus);
        probe.addEventListener('canplay', refreshProbeStatus);
        probe.addEventListener('canplaythrough', refreshProbeStatus);
        probe.addEventListener('durationchange', refreshProbeStatus);
        probe.addEventListener('suspend', refreshProbeStatus);
        probe.addEventListener('error', () => {
          videoStatusByUrl.set(candidate.url, 'error');
          clearPreloadProbe(candidate.url, probe);
          updateTicker();
          queueMicrotask(primePreloadCandidates);
        });
        probe.src = candidate.url;
        probe.load();
        preloadElements.set(candidate.url, probe);
        const pollId = window.setInterval(() => {
          if (!preloadElements.has(candidate.url)) {
            clearPreloadProbe(candidate.url, probe);
            return;
          }
          refreshProbeStatus();
          if (videoStatusByUrl.get(candidate.url) === 'ready') stopPreloadPoller(candidate.url);
          if (videoStatusByUrl.get(candidate.url) === 'error') clearPreloadProbe(candidate.url, probe);
        }, 1400);
        preloadStatusPollers.set(candidate.url, pollId);
        refreshProbeStatus();
      }
      updateTicker();
    }

    function prepareSocialFeed(messages, keyword, addressLabels = new Map()) {
      streamCardPool = parseSocialCards(messages, addressLabels);
      shownSocialCardKeys = new Set();
      if (!streamCardPool.length) {
        streamCardPool = [createSocialCard({ title: 'No social thread posts', meta: keyword, body: `No social feed cards were found for "${keyword}"`, links: [], keywords: [keyword], key: `none:${keyword}` })];
      }
      socialTimeline = streamCardPool;
    }

    function scheduleTimelineForCurrent(entry, nextEntry) {
      clearScheduledMessages();
      const creator = entry.from ? shortTitle(entry.from, 18) : 'p2fk';
      addMessage({
        title: `Now Playing: ${entry.title}`,
        meta: `${creator}${entry.createdAt ? ` · ${formatUtcDate(entry.createdAt)}` : ''}${entry.hash ? ` · ${entry.hash.slice(0, 12)}…` : ''}`,
        body: entry.description,
        imageUrl: entry.imageUrl || '',
        links: Array.isArray(entry.links) ? entry.links : [],
        keywords: Array.isArray(entry.keywords) ? entry.keywords : []
      });

      const currentTs = entry.timestamp;
      const nextTs = nextEntry?.timestamp;
      let cards = socialTimeline.filter((card) => {
        if (Number.isNaN(currentTs)) return true;
        if (Number.isNaN(card.timestamp)) return false;
        if (Number.isNaN(nextTs)) return card.timestamp >= currentTs;
        return card.timestamp >= currentTs && card.timestamp < nextTs;
      });
      cards = cards.filter((card) => !shownSocialCardKeys.has(card.key));
      const durationSeconds = Number.isFinite(dom.video.duration) && dom.video.duration > 0 ? dom.video.duration : 90;
      const spacing = Math.max(2200, Math.floor((durationSeconds * 1000) / ((cards.length || 1) + 1)));
      for (const [index, card] of cards.slice(0, 25).entries()) {
        const timeoutId = window.setTimeout(() => {
          if (shownSocialCardKeys.has(card.key)) return;
          shownSocialCardKeys.add(card.key);
          addMessage(card);
        }, spacing * (index + 1));
        scheduledMessageTimeouts.push(timeoutId);
      }
    }

    async function getPublicAddressByKeyword(keyword) {
      const endpoint = `${P2FK_BASE_URL}/GetPublicAddressByKeyword/${encodeURIComponent(keyword)}?mainnet=${USE_P2FK_MAINNET}`;
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error(`address lookup failed (${response.status})`);
      const payload = normalize(await response.text()).replace(/^"|"$/g, '');
      if (!payload) throw new Error('keyword address not found');
      return payload;
    }

    async function getPublicMessagesByAddress(address, skip = 0, qty = 200) {
      const endpoint = `${P2FK_BASE_URL}/GetPublicMessagesByAddress/${encodeURIComponent(address)}?skip=${skip}&qty=${qty}&mainnet=${USE_P2FK_MAINNET}`;
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error(`message lookup failed (${response.status})`);
      const payload = await response.json();
      return asArray(payload);
    }

    async function getKnownRootsBySearchString(searchString, skip = 0, qty = 200) {
      const endpoint = `${P2FK_BASE_URL}/GetKnownRootsBySearchString?searchString=${encodeURIComponent(searchString)}&skip=${skip}&qty=${qty}&mainnet=${USE_P2FK_MAINNET}&showSystemFiles=false`;
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error(`search lookup failed (${response.status})`);
      const payload = await response.json();
      return asArray(payload);
    }

    async function getKnownRootsBySearchStringWithTimeout(searchString, skip = 0, qty = 200, timeoutMs = TRENDING_KEYWORD_FETCH_TIMEOUT_MS) {
      let timeoutId = null;
      try {
        return await Promise.race([
          getKnownRootsBySearchString(searchString, skip, qty),
          new Promise((_, reject) => {
            timeoutId = setTimeout(() => reject(new Error(`search lookup timeout (${timeoutMs}ms)`)), timeoutMs);
          })
        ]);
      } finally {
        if (timeoutId) clearTimeout(timeoutId);
      }
    }

    async function getKeywordChannelMessages(keyword) {
      const address = await getPublicAddressByKeyword(keyword);
      return getPublicMessagesByAddress(address, 0, 200);
    }

    async function fetchTrendingKeywordMessages(keyword) {
      const [searchRaw, channelRaw] = await Promise.all([
        getKnownRootsBySearchStringWithTimeout(keyword, 0, TRENDING_SEARCH_QTY).then(asArray).catch(() => []),
        Promise.race([
          getKeywordChannelMessages(keyword),
          new Promise((resolve) => setTimeout(() => resolve([]), TRENDING_KEYWORD_FETCH_TIMEOUT_MS))
        ]).catch(() => [])
      ]);
      return mergeUniqueMessagesByTxid(channelRaw, searchRaw);
    }

    async function queryP2FK(keyword) {
      const [keywordChannelResult, mainSearchResult] = await Promise.allSettled([
        getKeywordChannelMessages(keyword),
        getKnownRootsSearchWindow(keyword, STANDARD_SEARCH_QTY)
      ]);
      const keywordMessages = keywordChannelResult.status === 'fulfilled' ? keywordChannelResult.value : [];
      const mainSearchMessages = mainSearchResult.status === 'fulfilled' ? mainSearchResult.value : [];
      const messages = mergeUniqueMessagesByTxid(keywordMessages, mainSearchMessages);
      const addressLabels = await resolveAddressLabels(messages);
      const items = dedupeItemsByTxid(parseItems(messages, addressLabels));
      if (!items.length) {
        throw new Error('no playable videos in keyword or search results');
      }
      return { items, messages, addressLabels };
    }

    function extractSearchString(entry) {
      return normalize(
        entry?.searchString
        || entry?.SearchString
        || entry?.keyword
        || entry?.Keyword
        || ''
      );
    }

    async function getTrendingKeywords(limit = TRENDING_KEYWORD_LIMIT) {
      try {
        const response = await fetch(TRENDING_SEARCHES_ENDPOINT, { cache: 'no-store' });
        if (!response.ok) {
          trendingStatsRows = [];
          return [DEFAULT_KEYWORD];
        }
        const payload = await response.json();
        const rows = asArray(payload);
        const unique = [];
        const seen = new Set();
        const statsByKeyword = new Map();
        const readMetric = (row, keys) => {
          for (const key of keys) {
            const raw = row?.[key];
            const value = parseMetricNumber(raw);
            if (Number.isFinite(value)) return value;
          }
          return Number.NaN;
        };
        for (const row of rows) {
          const candidate = extractSearchString(row);
          const candidateKey = normalizeKeywordKey(candidate);
          if (!candidate || seen.has(candidateKey)) continue;
          seen.add(candidateKey);
          unique.push(candidate);
          const views = readMetric(row, ['viewTotal', 'views', 'totalViews', 'viewCount', 'ViewTotal', 'Views', 'TotalViews', 'ViewCount']);
          const searches = readMetric(row, ['searchTotal', 'searchCount', 'count', 'total', 'SearchTotal', 'SearchCount', 'Count', 'Total']);
          statsByKeyword.set(candidateKey, {
            term: cleanDisplayText(candidate),
            views: Number.isFinite(views) ? views : 0,
            searches: Number.isFinite(searches) ? searches : 0
          });
        }
        trendingStatsRows = unique
          .map((term) => statsByKeyword.get(normalizeKeywordKey(term)))
          .filter(Boolean);
        renderBannerTrendingSearches();
        if (!unique.length) return [DEFAULT_KEYWORD];
        return unique.slice(0, limit);
      } catch (error) {
        console.warn('Unable to load trending searches; falling back to default keyword', error);
        trendingStatsRows = [];
        renderBannerTrendingSearches();
        return [DEFAULT_KEYWORD];
      }
    }


    async function getKnownRootsSearchWindow(searchString, maxSearchQty = STANDARD_SEARCH_QTY) {
      const STANDARD_SEARCH_PAGE_SIZE = 25;
      const messages = [];
      let skip = 0;
      while (skip < maxSearchQty) {
        const remaining = maxSearchQty - skip;
        const qty = Math.min(STANDARD_SEARCH_PAGE_SIZE, remaining);
        const page = await getKnownRootsBySearchString(searchString, skip, qty);
        const pageRows = asArray(page);
        if (!pageRows.length) break;
        messages.push(...pageRows);
        skip += pageRows.length;
        if (pageRows.length < qty) break;
      }
      return messages;
    }

    function batchItemsRoundRobin(perKeywordItems, batchSize = TRENDING_KEYWORD_BATCH_SIZE) {
      // Build the interleaved list WITHOUT cross-keyword dedup first.
      // Taking batchSize items from each group per round guarantees each keyword's slot
      // is filled even when keyword groups share content. A final dedup pass then removes
      // duplicate items while preserving the first (correct round-robin) occurrence.
      const interleavedItems = [];
      const maxGroupLength = perKeywordItems.reduce((max, group) => Math.max(max, group.length), 0);
      for (let offset = 0; offset < maxGroupLength; offset += batchSize) {
        for (const group of perKeywordItems) {
          const batch = group.slice(offset, offset + batchSize);
          interleavedItems.push(...batch);
        }
      }
      return dedupeItemsByTxid(interleavedItems);
    }

    async function queryTrendingP2FK() {
      if (trendingResultsCache) {
        return trendingResultsCache;
      }

      const keywords = await getTrendingKeywords(TRENDING_KEYWORD_LIMIT);

      // Start keyword fetches with bounded concurrency to avoid throttling p2fk.io bursts.
      // Each fetch still combines keyword-channel + text-search sources.
      // We resolve promises by keyword index so the progressive/final phases keep stable ordering.
      const deferred = keywords.map(() => createDeferred());
      const keywordFetches = deferred.map((d) => d.promise);
      const maxConcurrentFetches = Math.max(1, Math.min(TRENDING_KEYWORD_FETCH_CONCURRENCY, keywords.length));
      let nextKeywordIdx = 0;
      const runKeywordWorker = async () => {
        while (nextKeywordIdx < keywords.length) {
          const idx = nextKeywordIdx++;
          const raw = await fetchTrendingKeywordMessages(keywords[idx]).catch(() => []);
          deferred[idx].resolve(raw);
        }
      };
      // Fire workers in background; keywordFetches promises resolve as workers finish each index.
      const keywordWorkers = Array.from({ length: maxConcurrentFetches }, runKeywordWorker);
      keywordWorkers.forEach((workerPromise) => workerPromise.catch(() => {}));

      const firstRaw = await keywordFetches[0];
      const firstLabels = await resolveAddressLabels(firstRaw);
      // Only queue the first TRENDING_KEYWORD_BATCH_SIZE items from kw1 so the progressive
      // phase below can interleave other keywords' content before those finish playing.
      const firstItems = dedupeItemsByTxid(parseItems(firstRaw, firstLabels)).slice(0, TRENDING_KEYWORD_BATCH_SIZE);

      const displayKeyword = keywords.length === 1 && keywords[0].toLowerCase() === DEFAULT_KEYWORD.toLowerCase()
        ? DEFAULT_KEYWORD
        : 'trending';

      // Publish the partial result immediately so the cache is warm for logo-clicks
      // that arrive before the full background phase finishes.
      const partialResult = { items: firstItems, messages: firstRaw, addressLabels: firstLabels, keywords, displayKeyword };
      trendingResultsCache = partialResult;

      const bgFetchId = ++trendingBackgroundFetchId;

      // Progressive phase: as each keyword (kw2..kwN) resolves — they're already running
      // in parallel with kw1 — immediately append its first TRENDING_KEYWORD_BATCH_SIZE items.
      // Address labels are skipped here (cosmetic only) so there's zero extra network latency.
      // This ensures the queue grows with mixed content well before all keywords finish.
      keywordFetches.slice(1).forEach((fetchPromise) => {
        fetchPromise.then((raw) => {
          if (bgFetchId !== trendingBackgroundFetchId) return;
          if (!raw.length) return;
          // Parse without resolving address labels — labels are cosmetic (the "from" field)
          // and would require extra network requests. The final phase resolves them properly.
          const items = dedupeItemsByTxid(parseItems(raw, new Map()));
          const batch = items.slice(0, TRENDING_KEYWORD_BATCH_SIZE);
          if (!batch.length) return;
          // Keep a canonical progressive result list so items discovered before loadSearch
          // initializes playQueue are not lost when playQueue is assigned from result.items.
          const cachedItems = partialResult.items;
          const cachedUrls = new Set(cachedItems.map((i) => i.url));
          const cacheHeadroom = TRENDING_MAX_PLAYLIST_ITEMS - cachedItems.length;
          if (cacheHeadroom > 0) {
            const toCache = batch.filter((i) => !cachedUrls.has(i.url)).slice(0, cacheHeadroom);
            if (toCache.length) cachedItems.push(...toCache);
          }

          const existingQueueUrls = new Set(playQueue.map((i) => i.url));
          const toAdd = batch.filter((i) => !existingQueueUrls.has(i.url));
          const headroom = TRENDING_MAX_PLAYLIST_ITEMS - playQueue.length;
          const wasEmpty = !playQueue.length;
          if (toAdd.length && headroom > 0) {
            playQueue.push(...toAdd.slice(0, headroom));
            searchResultTotal = Math.max(searchResultTotal, partialResult.items.length, playQueue.length);
            updateTicker(playQueue, currentKeyword);
          }
          if (wasEmpty && playQueue.length) playCurrent();
        }).catch(() => {});
      });

      // Final phase: once ALL keyword fetches finish, rebuild the complete round-robin queue
      // with properly resolved address labels and replace the pending queue tail so the
      // viewer cycles through all keywords TRENDING_KEYWORD_BATCH_SIZE videos at a time.
      Promise.allSettled(keywordFetches).then(async (settled) => {
        if (bgFetchId !== trendingBackgroundFetchId) return; // superseded or cancelled by explicit search
        const allGroups = settled.map((r) => (r.status === 'fulfilled' ? r.value : []));
        const nonEmptyGroups = allGroups.filter((g) => g.length);
        if (!nonEmptyGroups.length) return;

        const allMessages = mergeUniqueMessagesByTxid(...nonEmptyGroups);
        const allLabels = await resolveAddressLabels(allMessages);
        if (bgFetchId !== trendingBackgroundFetchId) return;

        const perKeywordItems = allGroups.map((group) => dedupeItemsByTxid(parseItems(group, allLabels)));
        let allItems = batchItemsRoundRobin(perKeywordItems, TRENDING_KEYWORD_BATCH_SIZE);
        if (!allItems.length) allItems = firstItems;

        // Reorder the active playQueue to use the full round-robin sequence.
        // Keep playQueue[0] (currently playing) in place; replace the pending tail so
        // the viewer sees TRENDING_KEYWORD_BATCH_SIZE videos per keyword before switching.
        const current = playQueue[0];
        const currentUrl = current?.url;
        const wasEmpty = !current;

        // Rotate allItems to start just after the currently-playing entry so playback
        // continues naturally through the round-robin sequence.
        const currentIdxInAll = allItems.findIndex((i) => i.url === currentUrl);
        const startOffset = currentIdxInAll >= 0 ? currentIdxInAll + 1 : 0;
        const rotated = [...allItems.slice(startOffset), ...allItems.slice(0, startOffset)]
          .filter((i) => i.url !== currentUrl);
        const maxTail = TRENDING_MAX_PLAYLIST_ITEMS - (current ? 1 : 0);
        playQueue = current ? [current, ...rotated.slice(0, maxTail)] : rotated.slice(0, TRENDING_MAX_PLAYLIST_ITEMS);
        searchResultTotal = playQueue.length;
        updateTicker(playQueue, currentKeyword);
        if (wasEmpty && playQueue.length) playCurrent();

        trendingResultsCache = { items: allItems, messages: allMessages, addressLabels: allLabels, keywords, displayKeyword };
      }).catch(() => {}); // Background errors don't affect already-running playback

      return partialResult;
    }

    function playCurrent() {
      while (playQueue.length) {
        const candidate = playQueue[0];
        if (videoStatusByUrl.get(candidate.url) !== 'error') break;
        if (claimStreamRetry(candidate.url)) {
          videoStatusByUrl.set(candidate.url, 'downloading');
          addMessage({
            title: 'Retrying stream',
            meta: 'player',
            body: `Retrying "${candidate.title}" once after preload error`
          });
          break;
        }
        const failed = playQueue.shift();
        if (!failed) break;
        clearPreloadProbe(failed.url, preloadElements.get(failed.url));
        clearStreamRetry(failed.url);
        videoStatusByUrl.delete(failed.url);
        addMessage({
          title: 'Video skipped',
          meta: 'player',
          body: `Skipped "${failed.title}" after repeated stream errors`
        });
      }
      const entry = playQueue[0];
      if (!entry) {
        if (activeStreamTimeoutId) {
          clearTimeout(activeStreamTimeoutId);
          activeStreamTimeoutId = null;
        }
        showOffAir('OFF AIR • Playlist reached the end of search results');
        updateTicker(playQueue, currentKeyword);
        return;
      }
      currentEntry = entry;
      videoStatusByUrl.set(entry.url, 'playing');
      hideOffAir();
      updateTicker(playQueue, currentKeyword);
      scheduleTimelineForCurrent(entry, playQueue[1] || null);
      showWaiting(`Loading "${entry.title}"…`);
      const probe = preloadElements.get(entry.url);
      if (probe) {
        probe.muted = dom.video.muted;
        probe.volume = dom.video.volume;
        probe.id = dom.video.id;
        probe.setAttribute('playsinline', '');
        probe.setAttribute('aria-label', dom.video.getAttribute('aria-label') || 'SupTV video player');
        probe.tabIndex = dom.video.tabIndex;
        dom.video.parentNode.replaceChild(probe, dom.video);
        dom.video = probe;
        stopPreloadPoller(entry.url);
        preloadElements.delete(entry.url);
        attachVideoListeners(dom.video);
      } else {
        dom.video.src = entry.url;
        dom.video.load();
      }
      primePreloadCandidates();
      dom.video.play().catch(() => {
        console.warn('Autoplay blocked or failed for video:', entry.url);
      });
      setStatus(`Now Playing: ${entry.title} (${playQueue.length} left)`);
    }

    function nextVideo() {
      if (!playQueue.length) {
        if (activeStreamTimeoutId) {
          clearTimeout(activeStreamTimeoutId);
          activeStreamTimeoutId = null;
        }
        showOffAir('OFF AIR • Playlist reached the end of search results');
        return;
      }
      const last = playQueue.shift();
      if (last?.url) {
        clearPreloadProbe(last.url, preloadElements.get(last.url));
        clearStreamRetry(last.url);
        videoStatusByUrl.delete(last.url);
      }
      playCurrent();
    }

    function trashCurrentVideo() {
      const current = playQueue[0];
      if (!current) return;
      trashedVideoUrls.add(current.url);
      clearStreamRetry(current.url);
      videoStatusByUrl.delete(current.url);
      playQueue = playQueue.filter((item) => !trashedVideoUrls.has(item.url));
      addMessage({
        title: 'Video skipped',
        meta: 'skip',
        body: `Skipped "${current.title}" until you submit another keyword search`,
        imageUrl: ''
      });
      if (!playQueue.length) return showOffAir('OFF AIR • No videos remain after skip');
      playCurrent();
    }

    function showHudTemporarily() {
      if (!isFullscreenLikeMode()) return;
      dom.app.classList.remove('hidden-ui');
      if (hudTimer) {
        clearTimeout(hudTimer);
        hudTimer = null;
      }
      hudTimer = setTimeout(() => {
        if (isFullscreenLikeMode()) dom.app.classList.add('hidden-ui');
      }, HUD_IDLE_HIDE_MS);
    }

    function updateFullscreenUiState() {
      const inFullscreenLike = isFullscreenLikeMode();
      dom.app.classList.toggle('fullscreen-mode', inFullscreenLike);
      updateFullscreenButtonState();
      if (inFullscreenLike) {
        closeBannerMenu();
        showHudTemporarily();
      } else {
        dom.app.classList.remove('hidden-ui');
        if (hudTimer) clearTimeout(hudTimer);
        hudTimer = null;
      }
    }

    async function loadSearch(keyword, { resetSessionSkips = false } = {}) {
      const requestId = ++loadSearchRequestId;
      const cleanedInput = normalize(keyword);
      const isTrendingDefault = !cleanedInput;
      if (resetSessionSkips) trashedVideoUrls = new Set();
      // Clear the trending cache when the user performs an explicit keyword search so
      // returning to trending later re-fetches fresh results.
      if (!isTrendingDefault) {
        trendingResultsCache = null;
        trendingBackgroundFetchId++; // cancel any in-progress trending background fetch
      }
      let displayKeyword = isTrendingDefault ? 'trending' : cleanedInput;
      currentKeyword = displayKeyword;
      clearScheduledMessages();
      clearAllPreloadProbes();

      const url = new URL(window.location.href);
      if (cleanedInput) url.searchParams.set('q', cleanedInput);
      else url.searchParams.delete('q');
      window.history.replaceState({}, '', url);

      if (isTrendingDefault) setStatus('Loading trending searches…');
      else setStatus(`Searching p2fk.io for "${cleanedInput}"…`);

      try {
        const result = isTrendingDefault
          ? await queryTrendingP2FK()
          : await queryP2FK(cleanedInput);
        if (requestId !== loadSearchRequestId) return;
        if (isTrendingDefault && result?.displayKeyword) {
          displayKeyword = result.displayKeyword;
          currentKeyword = displayKeyword;
        }
        const { items, messages, addressLabels } = result;
        searchResultTotal = items.length;
        videoStatusByUrl = new Map();
        streamRetryCountByUrl = new Map();
        if (activeStreamTimeoutId) {
          clearTimeout(activeStreamTimeoutId);
          activeStreamTimeoutId = null;
        }
        const maxItems = isTrendingDefault ? TRENDING_MAX_PLAYLIST_ITEMS : MAX_PLAYLIST_ITEMS;
        playQueue = items.filter((item) => !trashedVideoUrls.has(item.url)).slice(0, maxItems);
        updateTicker(playQueue, displayKeyword);
        prepareSocialFeed(messages, displayKeyword, addressLabels);
        if (!playQueue.length) throw new Error('all videos were trashed in this session');
        playCurrent();
      } catch (error) {
        if (requestId !== loadSearchRequestId) return;
        searchResultTotal = 0;
        videoStatusByUrl = new Map();
        streamRetryCountByUrl = new Map();
        if (activeStreamTimeoutId) {
          clearTimeout(activeStreamTimeoutId);
          activeStreamTimeoutId = null;
        }
        playQueue = [];
        updateTicker([], displayKeyword);
        prepareSocialFeed([], displayKeyword);
        showOffAir(`Unable to load playable results for "${displayKeyword}" (${error?.message || 'request failed'})`);
      }
    }

    async function requestFullscreen() {
      const target = document.documentElement;
      if (getNativeFullscreenElement()) {
        if (document.exitFullscreen) await document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      if (pseudoFullscreenActive) {
        pseudoFullscreenActive = false;
        updateFullscreenUiState();
        return;
      }
      try {
        if (target.requestFullscreen) {
          await target.requestFullscreen();
          return;
        }
        if (target.webkitRequestFullscreen) {
          const webkitResult = target.webkitRequestFullscreen();
          // Some WebKit builds return void, others return a thenable.
          if (webkitResult && typeof webkitResult.then === 'function') await webkitResult;
          await new Promise((resolve) => window.setTimeout(resolve, FULLSCREEN_ACTIVATION_DELAY_MS));
          if (!getNativeFullscreenElement()) throw new Error(`WebKit fullscreen did not activate after ${FULLSCREEN_ACTIVATION_DELAY_MS}ms`);
          return;
        }
        if (dom.video.webkitEnterFullscreen) {
          dom.video.webkitEnterFullscreen();
          await new Promise((resolve) => window.setTimeout(resolve, FULLSCREEN_ACTIVATION_DELAY_MS));
          if (!dom.video.webkitDisplayingFullscreen) throw new Error(`Video WebKit fullscreen did not activate after ${FULLSCREEN_ACTIVATION_DELAY_MS}ms`);
          return;
        }
      } catch (error) {
        console.warn('Native fullscreen request failed, using pseudo-fullscreen fallback mode', error);
      }
      pseudoFullscreenActive = true;
      updateFullscreenUiState();
      dom.app.classList.add('hidden-ui');
      if (hudTimer) {
        clearTimeout(hudTimer);
        hudTimer = null;
      }
      setStatus('Fullscreen-style mode enabled (tap or move to show controls)');
    }

    async function downloadIndexHtml() {
      const sourceUrl = new URL(window.location.href);
      sourceUrl.search = '';
      sourceUrl.hash = '';
      const pathname = sourceUrl.pathname || '/';
      if (/\.html?$/i.test(pathname)) {
        sourceUrl.pathname = pathname.replace(/[^/]+$/, 'index.html');
      } else {
        sourceUrl.pathname = pathname.endsWith('/') ? `${pathname}index.html` : `${pathname}/index.html`;
      }
      try {
        setStatus('Preparing index.html download…');
        let htmlText = '';
        if (window.location.protocol === 'file:') {
          htmlText = `<!DOCTYPE html>\n${document.documentElement.outerHTML}`;
        } else {
          if (sourceUrl.origin !== window.location.origin) {
            throw new Error('download source must stay on the current origin');
          }
          const response = await fetch(sourceUrl.toString(), {
            cache: 'no-store',
            credentials: 'same-origin'
          });
          if (!response.ok) {
            throw new Error(`download request failed (${response.status})`);
          }
          htmlText = await response.text();
        }
        const downloadBlob = new Blob([htmlText], { type: 'text/html;charset=utf-8' });
        const downloadUrl = URL.createObjectURL(downloadBlob);
        const anchor = document.createElement('a');
        anchor.href = downloadUrl;
        anchor.download = 'index.html';
        anchor.rel = 'noopener noreferrer';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(downloadUrl), DOWNLOAD_BLOB_URL_REVOKE_DELAY_MS);
        setStatus('Downloading index.html…');
      } catch (error) {
        console.warn('Unable to download index.html', error);
        setStatus('Unable to download index.html right now');
      }
    }

    function attachVideoListeners(videoEl) {
      videoEl.addEventListener('ended', nextVideo);
      videoEl.addEventListener('error', () => {
        const activeItem = playQueue[0];
        const gatewayFallback = tryNextIpfsGateway(activeItem);
        if (gatewayFallback) {
          moveStatusToNewUrl(gatewayFallback.oldUrl, gatewayFallback.nextUrl, 'downloading');
          showWaiting('Switching IPFS gateway…');
          addMessage({
            title: 'Gateway fallback',
            meta: 'player',
            body: `Switching stream to ${formatGatewayFallbackLabel(gatewayFallback.nextIndex)}`
          });
          playCurrent();
          return;
        }
        if (activeItem?.url) videoStatusByUrl.set(activeItem.url, 'error');
        if (claimStreamRetry(activeItem?.url || '')) {
          showWaiting('Retrying stream once…');
          addMessage({
            title: 'Playback retry',
            meta: 'player',
            body: `Retrying "${activeItem?.title || 'current video'}" one more time before skip`
          });
          playCurrent();
          return;
        }
        console.warn('Video playback error after retry, skipping to next source');
        addMessage({ title: 'Playback warning', meta: 'player', body: 'Video playback issue persisted; skipping to next video' });
        nextVideo();
      });
      videoEl.addEventListener('waiting', () => showWaiting('Buffering next stream…'));
      videoEl.addEventListener('stalled', () => showWaiting('Network is slow, waiting for stream data…'));
      videoEl.addEventListener('playing', hideWaiting);
      videoEl.addEventListener('canplay', hideWaiting);
      videoEl.addEventListener('timeupdate', () => {
        if (!dom.waitingOverlay.classList.contains('visible')) return;
        if (videoEl.paused || videoEl.seeking) return;
        if (!Number.isFinite(videoEl.currentTime)) return;
        hideWaiting();
      });
      videoEl.addEventListener('loadedmetadata', () => {
        if (!currentEntry) return;
        if (videoEl.currentSrc && videoEl.currentSrc.includes(currentEntry.url)) {
          scheduleTimelineForCurrent(currentEntry, playQueue[1] || null);
        }
      });
      videoEl.addEventListener('click', () => {
        enableAudioFromUserGesture();
        videoEl.play().catch(() => {});
      });
      videoEl.addEventListener('click', showHudTemporarily);
      videoEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          enableAudioFromUserGesture();
          videoEl.play().catch(() => {});
        }
      });
    }

    function bootstrap() {
      const urlQuery = new URLSearchParams(window.location.search).get('q');
      const initial = normalize(urlQuery);
      // Keep the input blank so the UI starts clean while using trending defaults when no ?q is provided.
      dom.query.value = '';
      syncAudioUi();

      dom.searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        closeBannerMenu();
        loadSearch(dom.query.value, { resetSessionSkips: true });
      });

      window.addEventListener('resize', () => measureTicker());
      attachVideoListeners(dom.video);
      dom.audioBtn.addEventListener('click', toggleAudio);
      dom.downloadBtn.addEventListener('click', downloadIndexHtml);
      dom.fullscreenBtn.addEventListener('click', requestFullscreen);
      dom.skipInlineBtn.addEventListener('click', trashCurrentVideo);
      dom.brandBtn.addEventListener('click', () => {
        closeBannerMenu();
        dom.query.value = '';
        loadSearch('');
      });
      dom.tickerWrap.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleBannerMenu();
      });
      dom.tickerWrap.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        toggleBannerMenu();
      });
      dom.bannerQueueMoreBtn.addEventListener('click', () => {
        bannerQueueVisibleCount = Math.min(playQueue.length, bannerQueueVisibleCount + BANNER_QUEUE_PAGE_SIZE);
        renderBannerQueue();
      });
      document.addEventListener('click', (event) => {
        if (!bannerMenuOpen) return;
        const target = event.target;
        if (dom.bannerMenu.contains(target) || dom.tickerWrap.contains(target)) return;
        closeBannerMenu();
      });
      document.addEventListener('fullscreenchange', updateFullscreenUiState);
      document.addEventListener('webkitfullscreenchange', updateFullscreenUiState);
      dom.app.addEventListener('mousemove', (event) => {
        if (!isFullscreenLikeMode()) return;
        if (!lastMousePointer) {
          lastMousePointer = { x: event.clientX, y: event.clientY };
          return;
        }
        const dx = event.clientX - lastMousePointer.x;
        const dy = event.clientY - lastMousePointer.y;
        if ((dx * dx) + (dy * dy) >= (MOUSE_SHOW_DISTANCE_PX * MOUSE_SHOW_DISTANCE_PX)) {
          showHudTemporarily();
          lastMousePointer = { x: event.clientX, y: event.clientY };
        }
      });
      window.addEventListener('keydown', (event) => {
        if (event.target instanceof HTMLElement && ['INPUT', 'TEXTAREA'].includes(event.target.tagName)) return;
        if (event.key.toLowerCase() === 'f') requestFullscreen();
        if (event.key === 'Escape') {
          if (bannerMenuOpen) {
            closeBannerMenu();
            return;
          }
          if (pseudoFullscreenActive) {
            pseudoFullscreenActive = false;
            updateFullscreenUiState();
          } else {
            showHudTemporarily();
          }
        }
      });
      dom.app.addEventListener('click', showHudTemporarily);
      dom.app.addEventListener('touchstart', showHudTemporarily, { passive: true });
      const clearSwipeTug = (animate = true) => {
        if (swipeTugResetTimeoutId) {
          clearTimeout(swipeTugResetTimeoutId);
          swipeTugResetTimeoutId = null;
        }
        dom.app.classList.remove('swipe-tugging');
        if (animate) dom.app.classList.add('swipe-tug-release');
        else dom.app.classList.remove('swipe-tug-release');
        dom.app.style.setProperty('--swipe-tug-x', '0px');
        if (animate) {
          swipeTugResetTimeoutId = window.setTimeout(() => {
            dom.app.classList.remove('swipe-tug-release');
            swipeTugResetTimeoutId = null;
          }, swipeTugReleaseMs());
        }
      };
      const applySwipeTug = (deltaX, deltaY, ignoreSwipe) => {
        if (ignoreSwipe || deltaY > SWIPE_SKIP_MAX_Y_PX || deltaX > 0) {
          clearSwipeTug(false);
          return;
        }
        const distance = Math.min(SWIPE_TUG_MAX_X_PX, Math.max(0, -deltaX * SWIPE_TUG_DAMPING_FACTOR));
        if (distance < SWIPE_TUG_START_X_PX) {
          clearSwipeTug(false);
          return;
        }
        dom.app.classList.remove('swipe-tug-release');
        dom.app.classList.add('swipe-tugging');
        dom.app.style.setProperty('--swipe-tug-x', `${-distance}px`);
      };
      dom.app.addEventListener('touchstart', (event) => {
        if (!event.changedTouches?.length) return;
        const touch = event.changedTouches[0];
        clearSwipeTug(false);
        lastTouchPointer = {
          x: touch.clientX,
          y: touch.clientY,
          ignoreSwipe: isInteractiveTouchTarget(event.target)
        };
      }, { passive: true });
      dom.app.addEventListener('touchmove', (event) => {
        if (!event.changedTouches?.length || !lastTouchPointer) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - lastTouchPointer.x;
        const deltaY = Math.abs(touch.clientY - lastTouchPointer.y);
        applySwipeTug(deltaX, deltaY, lastTouchPointer.ignoreSwipe);
      }, { passive: true });
      dom.app.addEventListener('touchend', (event) => {
        if (!event.changedTouches?.length || !lastTouchPointer) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - lastTouchPointer.x;
        const deltaY = Math.abs(touch.clientY - lastTouchPointer.y);
        clearSwipeTug(true);
        if (!lastTouchPointer.ignoreSwipe && deltaX < -SWIPE_SKIP_MIN_X_PX && deltaY < SWIPE_SKIP_MAX_Y_PX) {
          trashCurrentVideo();
        }
        lastTouchPointer = null;
      }, { passive: true });
      dom.app.addEventListener('touchcancel', () => {
        clearSwipeTug(true);
        lastTouchPointer = null;
      }, { passive: true });

      loadSearch(initial);
      updateFullscreenButtonState();
    }

    bootstrap();
  </script>
</body>
</html>
