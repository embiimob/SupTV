<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupTV</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #02020a;
      --panel: rgba(5, 8, 18, 0.62);
      --accent: #41d1ff;
      --accent-2: #b18fff;
      --text: #f4f7ff;
      --muted: #a4b1d8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top right, #16233d, #050811 40%, #02020a 80%);
    }

    #player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent 20%, transparent 70%, rgba(0,0,0,.65));
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.1rem;
      background: linear-gradient(to bottom, rgba(1,3,8,.8), rgba(1,3,8,.08));
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .brand b { font-size: 1.15rem; }
    .brand span { color: var(--muted); font-size: .85rem; }

    .controls {
      display: flex;
      align-items: center;
      gap: .5rem;
      width: min(58vw, 680px);
      pointer-events: auto;
    }

    .controls input {
      flex: 1;
      background: rgba(12, 18, 34, 0.86);
      border: 1px solid rgba(120, 143, 198, .4);
      color: var(--text);
      border-radius: .7rem;
      padding: .65rem .8rem;
      font-size: .96rem;
      outline: none;
    }

    .controls button {
      border: none;
      border-radius: .7rem;
      padding: .65rem .9rem;
      color: #00131f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 700;
      cursor: pointer;
    }

    .side-feed {
      position: absolute;
      right: 1rem;
      top: 5.25rem;
      width: min(32vw, 420px);
      max-height: min(58vh, 520px);
      overflow: hidden;
      border-radius: 1rem;
      background: var(--panel);
      border: 1px solid rgba(129, 150, 204, .28);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .side-feed h2 {
      margin: 0;
      padding: .8rem .9rem;
      border-bottom: 1px solid rgba(129, 150, 204, .3);
      font-size: .85rem;
      letter-spacing: .09em;
      color: var(--muted);
      text-transform: uppercase;
    }

    #messages {
      list-style: none;
      margin: 0;
      padding: .7rem .9rem .9rem;
      display: grid;
      gap: .45rem;
      font-size: .86rem;
    }

    #messages li {
      background: rgba(18, 28, 52, .42);
      padding: .55rem .62rem;
      border-radius: .55rem;
      border: 1px solid rgba(126, 157, 222, .22);
    }

    .message-card-title {
      font-size: .85rem;
      font-weight: 700;
      margin-bottom: .26rem;
      line-height: 1.2;
    }

    .message-card-meta {
      font-size: .72rem;
      letter-spacing: .02em;
      color: #b6c8f2;
      margin-bottom: .2rem;
      opacity: .9;
    }

    .message-card-body {
      font-size: .8rem;
      color: #dce8ff;
      line-height: 1.25;
      max-height: 3.1em;
      overflow: hidden;
    }

    .status {
      position: absolute;
      left: 1rem;
      bottom: 3.6rem;
      pointer-events: none;
      font-size: .95rem;
      color: #e9f1ff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, .7);
      max-width: min(70vw, 900px);
    }

    .ticker-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2.7rem;
      border-top: 1px solid rgba(131, 152, 206, .3);
      background: rgba(4, 8, 20, .85);
      overflow: hidden;
      pointer-events: none;
    }

    #ticker {
      position: absolute;
      white-space: nowrap;
      padding-left: 100%;
      line-height: 2.7rem;
      color: #dbebff;
      font-weight: 600;
      animation: crawl 26s linear infinite;
    }

    @keyframes crawl {
      from { transform: translateX(0%); }
      to { transform: translateX(-100%); }
    }

    @media (max-width: 920px) {
      .side-feed { width: calc(100vw - 2rem); top: auto; bottom: 6.9rem; max-height: 26vh; }
      .controls { width: min(72vw, 560px); }
      .brand span { display: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <video id="player" autoplay muted playsinline aria-label="SupTV video player" tabindex="0"></video>
    <div class="overlay"></div>

    <header class="topbar">
      <div class="brand"><b>SupTV</b><span>Always-on stream</span></div>
      <form class="controls" id="searchForm" autocomplete="off">
        <input id="query" type="text" placeholder="Search p2fk.io videos by keyword" />
        <button type="submit">Play</button>
        <button type="button" id="fullscreenBtn" aria-keyshortcuts="f">Full Screen</button>
      </form>
    </header>

    <section class="side-feed" aria-live="polite">
      <h2>Live Messages</h2>
      <ul id="messages"></ul>
    </section>

    <div class="status" id="status" role="status" aria-live="polite">Loading…</div>
    <div class="ticker-wrap"><div id="ticker"></div></div>
  </main>

  <script>
    const dom = {
      video: document.getElementById('player'),
      status: document.getElementById('status'),
      ticker: document.getElementById('ticker'),
      messages: document.getElementById('messages'),
      query: document.getElementById('query'),
      searchForm: document.getElementById('searchForm'),
      fullscreenBtn: document.getElementById('fullscreenBtn')
    };

    const MESSAGE_UPDATE_INTERVAL_MS = 2100;
    const P2FK_BASE_URL = 'https://p2fk.io';
    const IPFS_GATEWAY_URL = 'https://ipfs.io/ipfs/';
    const USE_MAINNET = false;
    const VIDEO_FILE_REGEX = /([a-zA-Z0-9\s._-]+\.(mp4|webm|ogv|mov|avi|m3u8))/i;
    const IPFS_REGEX = /IPFS:([a-zA-Z0-9]{46}|[a-zA-Z0-9]{59})(?:[\\/]+([^\s]+))?/i;
    const DIRECT_VIDEO_REGEX = /(https?:\/\/[^\s"']+\.(mp4|webm|ogv|mov|avi|m3u8)(\?[^\s"']*)?)/i;
    let streamTimer = null;
    let streamQueue = [];
    let playlist = [];
    let pointer = 0;
    let streamTextPool = [];

    const normalize = (value) => (typeof value === 'string' ? value.trim() : '');
    const stripPathParts = (value) => normalize(value).split(/[\\/]/).pop() || '';
    const tickerLabel = (keyword) => `LIVE • ${keyword.toUpperCase()} • `;
    const cleanDisplayText = (value) => normalize(value).replace(/[<>]/g, '').replace(/>{2,}|<{2,}/g, '').slice(0, 220);
    const formatUtcDate = (value) => {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
    };

    function setStatus(text) {
      dom.status.textContent = text;
    }

    function asArray(payload) {
      if (Array.isArray(payload)) return payload;
      if (!payload || typeof payload !== 'object') return [];
      if (Array.isArray(payload.results)) return payload.results;
      if (Array.isArray(payload.data)) return payload.data;
      if (Array.isArray(payload.items)) return payload.items;
      if (payload.data && Array.isArray(payload.data.items)) return payload.data.items;
      return [];
    }

    function parseItems(messages) {
      const seen = new Set();
      const isValidIpfsVideoMessage = (messageText) => {
        const ipfsMatch = messageText.match(IPFS_REGEX);
        const fileMatch = messageText.match(VIDEO_FILE_REGEX);
        return { ipfsMatch, fileMatch, valid: Boolean(ipfsMatch && fileMatch) };
      };
      return messages
        .map((msg) => {
          const messageText = normalize(msg?.Message || msg?.message || msg?.text);
          if (!messageText) return null;

          const directMatch = messageText.match(DIRECT_VIDEO_REGEX);
          if (directMatch) {
            const directUrl = directMatch[1];
            if (seen.has(directUrl)) return null;
            seen.add(directUrl);
            const title = cleanDisplayText(normalize(msg?.Subject) || normalize(msg?.subject) || 'Direct stream');
            return {
              url: directUrl,
              title,
              description: cleanDisplayText(messageText),
              tags: [],
              from: cleanDisplayText(msg?.FromAddress || msg?.fromAddress || ''),
              createdAt: msg?.BlockDate || msg?.blockDate || '',
              hash: ''
            };
          }

          const { ipfsMatch, fileMatch, valid } = isValidIpfsVideoMessage(messageText);
          if (!valid) return null;
          const hash = ipfsMatch[1];
          const sourcePath = normalize(fileMatch[1] || '');
          const filename = stripPathParts(sourcePath).trim();
          const url = `${IPFS_GATEWAY_URL}${hash}`;
          if (seen.has(url)) return null;
          seen.add(url);

          return {
            url,
            title: cleanDisplayText(filename || `IPFS ${hash.slice(0, 12)}`),
            description: cleanDisplayText(messageText),
            tags: [],
            from: cleanDisplayText(msg?.FromAddress || msg?.fromAddress || ''),
            createdAt: msg?.BlockDate || msg?.blockDate || '',
            hash
          };
        })
        .filter(Boolean);
    }

    function updateTicker(items, keyword) {
      const headlines = items.slice(0, 10).map((v, idx) => `${idx + 1}. ${v.title}`);
      dom.ticker.textContent = headlines.length
        ? `${tickerLabel(keyword)}${headlines.join('  ✦  ')}`
        : `${tickerLabel(keyword)}No matching videos`;
    }

    function addMessage(card) {
      if (!card) return;
      const li = document.createElement('li');
      const title = document.createElement('div');
      title.className = 'message-card-title';
      title.textContent = cleanDisplayText(card.title || 'Live update');
      li.appendChild(title);

      if (card.meta) {
        const meta = document.createElement('div');
        meta.className = 'message-card-meta';
        meta.textContent = cleanDisplayText(card.meta);
        li.appendChild(meta);
      }

      if (card.body) {
        const body = document.createElement('div');
        body.className = 'message-card-body';
        body.textContent = cleanDisplayText(card.body);
        li.appendChild(body);
      }

      dom.messages.prepend(li);
      while (dom.messages.children.length > 8) {
        dom.messages.removeChild(dom.messages.lastChild);
      }
    }

    function resetStreamMessages(items, keyword) {
      streamTextPool = [];
      for (const item of items.slice(0, 30)) {
        const creator = item.from ? `${item.from.slice(0, 12)}…` : 'p2fk';
        const postedAt = formatUtcDate(item.createdAt);
        const hashTag = item.hash ? ` · ${item.hash.slice(0, 12)}…` : '';
        streamTextPool.push({
          title: item.title,
          meta: `${creator}${postedAt ? ` · ${postedAt}` : ''}${hashTag}`,
          body: item.description
        });
      }
      if (!streamTextPool.length) {
        streamTextPool.push({ title: 'No live updates', meta: keyword, body: `No live updates for "${keyword}"` });
      }

      dom.messages.innerHTML = '';
      addMessage({ title: `Keyword: ${keyword}`, meta: 'p2fk channel', body: 'Streaming freshest matching video messages' });
      for (const card of streamTextPool.slice(0, 3)) addMessage(card);
      streamQueue = streamTextPool
        .map((card) => ({ card, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map((entry) => entry.card);

      if (streamTimer) clearInterval(streamTimer);
      streamTimer = setInterval(() => {
        if (!streamQueue.length) {
          streamQueue = streamTextPool
            .map((card) => ({ card, sort: Math.random() }))
            .sort((a, b) => a.sort - b.sort)
            .map((entry) => entry.card);
        }
        const next = streamQueue.shift() || null;
        addMessage(next);
      }, MESSAGE_UPDATE_INTERVAL_MS);
    }

    async function getPublicAddressByKeyword(keyword) {
      const endpoint = `${P2FK_BASE_URL}/GetPublicAddressByKeyword/${encodeURIComponent(keyword)}?mainnet=${USE_MAINNET}`;
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error(`address lookup failed (${response.status})`);
      const payload = normalize(await response.text()).replace(/^"|"$/g, '');
      if (!payload) throw new Error('keyword address not found');
      return payload;
    }

    async function getPublicMessagesByAddress(address, skip = 0, qty = 200) {
      const endpoint = `${P2FK_BASE_URL}/GetPublicMessagesByAddress/${encodeURIComponent(address)}?skip=${skip}&qty=${qty}&mainnet=${USE_MAINNET}`;
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error(`message lookup failed (${response.status})`);
      const payload = await response.json();
      return asArray(payload);
    }

    async function queryP2FK(keyword) {
      const address = await getPublicAddressByKeyword(keyword);
      const messages = await getPublicMessagesByAddress(address, 0, 200);
      const items = parseItems(messages);
      if (!items.length) {
        throw new Error('no playable videos in keyword channel');
      }
      return items;
    }

    function playCurrent() {
      const entry = playlist[pointer];
      if (!entry) return;
      dom.video.src = entry.url;
      dom.video.play().catch(() => {
        console.warn('Autoplay blocked or failed for video:', entry.url);
        setStatus(`Loaded "${entry.title}" — tap/click to play`);
      });
      setStatus(`Now Playing: ${entry.title}`);
    }

    function nextVideo() {
      if (!playlist.length) return;
      pointer = (pointer + 1) % playlist.length;
      playCurrent();
    }

    async function loadSearch(keyword) {
      const cleaned = keyword.trim();
      if (!cleaned) return;

      const url = new URL(window.location.href);
      url.searchParams.set('q', cleaned);
      window.history.replaceState({}, '', url);

      setStatus(`Searching p2fk.io for "${cleaned}"…`);

      try {
        const items = await queryP2FK(cleaned);
        playlist = items;
        pointer = 0;
        updateTicker(items, cleaned);
        resetStreamMessages(items, cleaned);
        playCurrent();
      } catch (error) {
        playlist = [];
        updateTicker([], cleaned);
        resetStreamMessages([], cleaned);
        setStatus(`Unable to load playable results for "${cleaned}" (${error?.message || 'request failed'})`);
      }
    }

    function requestFullscreen() {
      const target = document.documentElement;
      if (!document.fullscreenElement && target.requestFullscreen) {
        target.requestFullscreen().catch(() => {
          setStatus('Fullscreen is not available in this browser context');
        });
      }
    }

    function bootstrap() {
      const urlQuery = new URLSearchParams(window.location.search).get('q');
      const initial = urlQuery || 'supgalaxy';
      dom.query.value = initial;

      dom.searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        loadSearch(dom.query.value);
      });

      dom.video.addEventListener('ended', nextVideo);
      dom.video.addEventListener('error', () => {
        console.warn('Video playback error, skipping to next source');
        addMessage({ title: 'Playback warning', meta: 'player', body: 'Video playback issue detected; trying next video' });
        nextVideo();
      });
      dom.video.addEventListener('click', () => dom.video.play().catch(() => {}));
      dom.video.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          dom.video.play().catch(() => {});
        }
      });
      dom.fullscreenBtn.addEventListener('click', requestFullscreen);
      window.addEventListener('keydown', (event) => {
        if (event.target instanceof HTMLElement && ['INPUT', 'TEXTAREA'].includes(event.target.tagName)) return;
        if (event.key.toLowerCase() === 'f') requestFullscreen();
      });

      loadSearch(initial);
    }

    bootstrap();
  </script>
</body>
</html>
